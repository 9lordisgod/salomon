[package]
name = "salomon-core"
version = "0.0.1"
edition = "2021"
publish = false
description = "Salomon fail-closed ask core (M-A0 stub)"

[lib]
name = "salomon_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
# Default on so Android cdylib exports Java_* symbols.
jni = ["dep:jni"]

[dependencies]
jni = { version = "0.22.4", optional = true }
